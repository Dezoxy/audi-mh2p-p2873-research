name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [ksh, mksh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shells and tools used by the installer fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ksh mksh bsdextrautils
      - name: Install pinned Python dependencies
        run: python -m pip install -r tools/requirements.lock.txt
      - name: Run the test suite (firmware-dependent tests skip)
        env:
          AUDI_TEST_KSH: /usr/bin/${{ matrix.shell }}
        run: python -m unittest discover -s tests -v
